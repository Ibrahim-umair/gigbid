[project]
name = "gigbid"
version = "0.2.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6",
  "httpx>=0.27",
  "python-dotenv>=1",
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.9",
  "rank-bm25>=0.2.2",
  "fastembed>=0.5",
  "numpy",
  "cryptography>=42",
  "sse-starlette>=2",
  "arq>=0.26",
  "python-multipart>=0.0.9",
]

[project.scripts]
gigbid-portfolio = "mcp_servers.portfolio.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "gigsim*", "apps*", "evals*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008"]  # FastAPI Depends()/File() defaults are idiomatic
